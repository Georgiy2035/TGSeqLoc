# Sec. IV-E.2 (LaBSE)
# Expected test result: R@1 86.56, R@5 91.30, R@10 93.58 (1012 queries)
# Weights: encoder_labse.pth
dataset:
  adapter: v4rl
  text_root_template: v4rl/text/qwen3_vl_4b-yolo11x_seg/{sequence}
  scene_graph_root_template: v4rl/graphs/mask2former/{sequence}
  gt_path: v4rl/gt_shop_street_1.txt
  split_guard: ground_truth_blocks
  validation_centres: [0.3, 0.6]
  interpolate_gt: true
preprocess:
  text_encoder:
    backend: multilingual_e5
    params: {model_name: sentence-transformers/LaBSE, prefix: '', pooling: cls}
model: {text_emb_dim: 768, text_fusion: additive}
training: {positive_interval_fraction: 0.5}
retrieval: {top_k: 100}
