# Table II (Grounding DINO)
# Expected test result: R@1 91.21, R@5 95.95, R@10 96.84 (1012 queries)
# Weights: additive_grounding_dino.pth
dataset:
  adapter: v4rl
  text_root_template: v4rl/text/qwen3_vl_4b-yolo11x_seg/{sequence}
  scene_graph_root_template: v4rl/graphs/grounding_dino/{sequence}
  gt_path: v4rl/gt_shop_street_1.txt
  split_guard: ground_truth_blocks
  validation_centres: [0.3, 0.6]
  interpolate_gt: true
model: {text_fusion: additive}
training: {positive_interval_fraction: 0.5}
retrieval: {top_k: 100}
