# Table II (SceneGraphVLM, fine-tuned)
# Expected test result: R@1 80.24, R@5 88.74, R@10 91.01 (1012 queries)
# Weights: additive_scenegraphvlm_ft.pth
dataset:
  adapter: v4rl
  text_root_template: v4rl/text/qwen3_vl_4b-yolo11x_seg/{sequence}
  scene_graph_root_template: v4rl/graphs/scenegraphvlm_ft/{sequence}
  gt_path: v4rl/gt_shop_street_1.txt
  split_guard: ground_truth_blocks
  validation_centres: [0.3, 0.6]
  interpolate_gt: true
model: {text_fusion: additive}
training: {positive_interval_fraction: 0.5}
retrieval: {top_k: 100}
