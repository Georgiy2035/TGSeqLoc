dataset:
  adapter: v4rl
  root: /mnt/external_usb_hdd/6YL/Datasets/v4rl
  sequences: [seq1, seq2]
  ocr_root_template: /home/sitnikov_sv/ocr_benchmark/results/v4rl_{sequence}
  ocr_file_name: qwen3_vl_4b.json
  scene_graph_root_template: /mnt/external_usb_hdd/6YL/tgseqloc/data/scene_graphs_m2f/{sequence}
  gt_path: /mnt/external_usb_hdd/6YL/Datasets/v4rl/gt_shop_street_1/gt_shop_street_1.txt
  prepared_root: /home/sitnikov_sv/tgseqloc_data/abl_v4_qwen
  reference_sequence: seq1
  query_sequence: seq2
  test_ratio: 0.2
  validation_ratio: 0.1
  interpolate_gt: true
  chunk_size: 200
  split_guard: ground_truth_blocks
  validation_centres: [0.3, 0.6]
segmentation:
  backend: yolo_seg
  weights: yolo11x_seg
  params:
    confidence: 0.25
text_dynamics:
  backend: mask_ioa
  params:
    threshold: 0.5
preprocess:
  encoder_batch_size: 256
  text_min_length: 3
  text_drop_numeric: true
  use_text_nodes: true
  text_encoder:
    backend: char_ngram
    params:
      embedding_dim: 64
model:
  use_text_nodes: true
  text_emb_dim: 64
  hidden_dim: 256
  proj_dim: 256
  n_layers: 1
  text_fusion: set
training:
  epochs: 30
  patience: 5
  batch_size: 8
  learning_rate: 3.0e-5
  miner_warmup_epochs: 10
  positive_interval_fraction: 0.5
runtime:
  device: auto
  seed: 44
  deterministic: true
output:
  experiment_name: v4abl-set_ref-s44
retrieval:
  top_k: 100
