[project]
name = "tgseqloc"
version = "0.1.0"
description = "Text-Graph based place recognition experimental pipeline"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.13.5",
    "aiosignal==1.4.0",
    "annotated-doc==0.0.4",
    "anyio==4.13.0",
    "attrs==26.1.0",
    "certifi==2026.4.22",
    "charset-normalizer==3.4.7",
    "click==8.3.3",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "faiss-cpu==1.13.2",
    "filelock>=3.29.0",
    "fonttools==4.62.1",
    "frozenlist==1.8.0",
    "fsspec>=2026.3.0",
    "h11==0.16.0",
    "hf-xet==1.4.3",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==1.7.2",
    "idna==3.13",
    "jinja2>=3.1.6",
    "joblib==1.5.3",
    "kiwisolver==1.5.0",
    "markdown-it-py==4.0.0",
    "markupsafe>=3.0.3",
    "matplotlib==3.10.8",
    "mdurl==0.1.2",
    "mpmath>=1.3.0",
    "multidict==6.7.1",
    "networkx>=3.6.1",
    "numpy==2.3.5",
    "packaging==26.1",
    "pillow==12.0.0",
    "propcache==0.4.1",
    "psutil==7.2.2",
    "pygments==2.20.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "rich==15.0.0",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "setuptools",
    "shellingham==1.5.4",
    "six==1.17.0",
    "sympy>=1.13.1",
    "threadpoolctl==3.6.0",
    "torch==2.11.0",
    "torch-geometric==2.7.0",
    "torchvision>=0.26",
    "tqdm==4.67.3",
    "transformers>=4.49,<6",
    "typer==0.24.2",
    "typing-extensions>=4.15.0",
    "urllib3==2.6.3",
    "xxhash==3.6.0",
    "yarl==1.23.0",
]

[project.optional-dependencies]
# Нужны только стадии сегментации; без них пайплайн собирается и работает.
segmentation = [
    "ultralytics>=8.4",
    "pycocotools>=2.0.11",
]

[project.scripts]
tgseqloc = "tgseqloc.cli:app"

[tool.uv.sources]
# Сборки с сайта PyPI собраны под CUDA 12.4 и не содержат ядер для sm_120
# (Blackwell, RTX 50xx): torch.cuda.is_available() отвечает True, а первая же
# операция падает. Индекс cu128 даёт сборку с нужными ядрами.
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
